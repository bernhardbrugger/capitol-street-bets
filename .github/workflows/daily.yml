name: Daily refresh

on:
  schedule:
    # 23:15 UTC on weekdays, after the US cash close.
    - cron: "15 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: capitol-cache-${{ github.run_id }}
          restore-keys: |
            capitol-cache-
      - name: Ingest what the plan allows, then score
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          if [ -z "$ALPHAVANTAGE_API_KEY" ]; then
            echo "ALPHAVANTAGE_API_KEY is not set. Keeping the JSON already in the repo."
            exit 0
          fi
          PYTHONPATH=src python -m capitol_gains run
      - name: Commit refreshed JSON
        run: |
          git config user.name "capitol-gains"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "Refresh league data"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        env:
          VITE_BASE: /capitol-gains/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
