name: Refresh and deploy

# Alpha Vantage is called at most once a day (the scheduled run, or a manual
# "Run workflow"). A push to main only rebuilds and redeploys the site from the
# JSON already in the repo, so code changes never spend API budget.

on:
  schedule:
    # Every day at 05:17 UTC, after the US close and the overnight filings.
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      # The SQLite cache holds the roster, trades and price history between runs.
      # Daily runs keep it from expiring.
      - uses: actions/cache/restore@v4
        if: github.event_name != 'push'
        with:
          path: data/cache
          key: capitol-cache-${{ github.run_id }}
          restore-keys: |
            capitol-cache-

      - name: Ingest what the plan allows, then score
        if: github.event_name != 'push'
        env:
          # Only ever read from the repository secret. Never echoed, never written to disk.
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          if [ -z "$ALPHAVANTAGE_API_KEY" ]; then
            echo "ALPHAVANTAGE_API_KEY is not set. Keeping the JSON already in the repo."
            exit 0
          fi
          PYTHONPATH=src python -m capitol_street_bets run

      # Saved even when a later step fails, so spent API calls are never lost.
      - uses: actions/cache/save@v4
        if: always() && github.event_name != 'push' && hashFiles('data/cache/*.sqlite') != ''
        with:
          path: data/cache
          key: capitol-cache-${{ github.run_id }}

      - name: Write current standings into README
        if: github.event_name != 'push'
        run: PYTHONPATH=src python -m capitol_street_bets readme --url "$SITE_URL"

      - name: Commit refreshed data and README
        if: github.event_name != 'push'
        run: |
          git config user.name "capitol-street-bets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data README.md
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "Refresh league data ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        env:
          # Project pages live at /<repo-name>/.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      # Pages needs a public repo on a free plan. While the repo is private,
      # data and README still refresh; the deploy waits until it is public.
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: web/dist
      - id: deployment
        if: ${{ !github.event.repository.private }}
        uses: actions/deploy-pages@v4
